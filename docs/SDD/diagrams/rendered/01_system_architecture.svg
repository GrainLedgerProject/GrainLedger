s</text><text x="805" y="1025" text-anchor="middle" font-family="Arial,sans-serif" font-size="21">Protected SQL + EF Core; durable evidence and snapshots</text><path d="M660,770 L660,890" fill="none" stroke="#111" stroke-width="1.7" marker-end="url(#a)"/><text x="660.0" y="821.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">same transaction</text><path d="M970,890 L970,770" fill="none" stroke="#111" stroke-width="1.7" marker-end="url(#a)" stroke-dasharray="7 5"/><text x="970.0" y="821.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">scoped reads</text><text x="800" y="1138" text-anchor="middle" font-family="Arial,sans-serif" font-size="18">Solid boxes: observed foundation. Dashed boxes: planned capabilities. Full future design is retained; database diagrams are not redrawn.</text></svg>