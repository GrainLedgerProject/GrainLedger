name: CI

on:
  pull_request:
  push:
    branches: [dev, main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: plan and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_backend: ${{ steps.plan.outputs.run_backend }}
      run_web: ${{ steps.plan.outputs.run_web }}
      run_container: ${{ steps.plan.outputs.run_container }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify CI routing and failure handling
        run: node --test .github/scripts/ci.test.mjs
      - name: Validate workflow with actionlint
        run: |
          tools_dir="$(mktemp -d)"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$tools_dir/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $tools_dir/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$tools_dir/actionlint.tar.gz" -C "$tools_dir" actionlint
          "$tools_dir/actionlint" -color
      - name: Select required jobs and check local documentation links
        id: plan
        env:
          # Start with full runs. Opt in only after the first GitHub baseline.
          CI_ENABLE_PATH_FILTERS: ${{ vars.CI_ENABLE_PATH_FILTERS }}
        run: node .github/scripts/ci.mjs plan

  backend:
    name: backend
    needs: changes
    if: needs.changes.outputs.run_backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      ASPNETCORE_ENVIRONMENT: Testing
      DOTNET_ENVIRONMENT: Testing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Check SDK and Docker
        run: |
          dotnet --version
          docker info
      - name: Restore
        run: dotnet restore GrainLedger.slnx
      - name: Build Release
        run: dotnet build GrainLedger.slnx --configuration Release --no-restore
      - name: Test against disposable PostgreSQL
        run: >-
          dotnet test GrainLedger.slnx --configuration Release --no-build --no-restore
          --logger trx --results-directory artifacts/test-results/backend
          -- xUnit.MaxParallelThreads=2
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-results
          path: artifacts/test-results/backend/**/*.trx
          if-no-files-found: warn
          retention-days: 7

  web:
    name: web
    needs: changes
    if: needs.changes.outputs.run_web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Check Node and npm
        run: |
          node --version
          npm --version
      - name: Install locked dependencies
        run: npm ci
      - name: Build production web assets and check TypeScript
        run: npm run build
      - name: Test
        # Avoid spawning one expensive jsdom worker per available CPU/file.
        run: npm run test --workspace @grainledger/web -- --maxWorkers=2

  container:
    name: container
    needs: changes
    if: needs.changes.outputs.run_container == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build application image without publishing
        run: docker build --tag grainledger:ci .

  required:
    name: required
    if: always()
    needs: [changes, backend, web, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require all selected checks to succeed
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: node .github/scripts/ci.mjs gate
