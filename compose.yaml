services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: grainledger
      # One-time local provisioning administrator, not either app login.
      POSTGRES_USER: grainledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    # Provision separate migration/runtime roles via README before Development --migrate.
    # Development/Testing MockCapture uses only isolated capture_mock schema; never teammate capture.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grainledger -d grainledger"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
